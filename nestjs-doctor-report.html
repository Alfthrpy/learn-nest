ice.update(id, updatePlaceDto);\r\n  }\r\n\r\n  @Delete(':id')\r\n  @Permissions(PERMISSIONS.PLACE.DELETE)\r\n  @HttpCode(HttpStatus.NO_CONTENT)\r\n  @ApiOperation({ summary: 'Delete place (soft delete)' })\r\n  @ApiParam({ name: 'id', type: Number })\r\n  @ApiNoContentResponse({ description: 'Place soft-deleted' })\r\n  async remove(@Param('id', ParseIntPipe) id: number): Promise<void> {\r\n    return this.placeService.remove(id);\r\n  }\r\n\r\n}\r\n","D:/CODING/WEB/learn-nest/src/modules/places/core/dto/create-place.dto.ts":"import { ApiProperty } from '@nestjs/swagger';\nimport {\n  IsBoolean,\n  IsInt,\n  IsNotEmpty,\n  IsNumber,\n  IsOptional,\n  IsString,\n  Max,\n  Min,\n} from 'class-validator';\n\nexport class CreatePlaceDto {\n  @ApiProperty({ example: 'Place Name' })\n  @IsNotEmpty({ message: 'Name is required' })\n  @IsString()\n  name: string;\n\n  @ApiProperty({ example: 'Place description', required: false })\n  @IsOptional()\n  @IsString()\n  description?: string;\n\n  @ApiProperty({ example: -6.9218, description: 'Latitude in decimal degrees' })\n  @IsNotEmpty({ message: 'Latitude is required' })\n  @IsNumber({}, { message: 'Latitude must be a number' })\n  @Min(-90, { message: 'Latitude must be between -90 and 90' })\n  @Max(90, { message: 'Latitude must be between -90 and 90' })\n  latitude: number;\n\n  @ApiProperty({ example: 107.607, description: 'Longitude in decimal degrees' })\n  @IsNotEmpty({ message: 'Longitude is required' })\n  @IsNumber({}, { message: 'Longitude must be a number' })\n  @Min(-180, { message: 'Longitude must be between -180 and 180' })\n  @Max(180, { message: 'Longitude must be between -180 and 180' })\n  longitude: number;\n\n  @ApiProperty({ example: 1, description: 'User ID' })\n  @IsNotEmpty({ message: 'User ID is required' })\n  @IsInt({ message: 'User ID must be an integer' })\n  userId: number;\n\n  @ApiProperty({ example: 2, description: 'Layer ID for the point feature' })\n  @IsNotEmpty({ message: 'Layer ID is re ache } from 'cache-manager';\r\nimport { PrismaService } from '@common/prisma/prisma.service';\r\nimport { CreatePlaceDto } from './core/dto/create-place.dto';\r\nimport { UpdatePlaceDto } from './core/dto/update-place.dto';\r\nimport { PlaceEntity } from './core/entities/place.entity';\r\nimport { PlaceQueryDto } from './core/dto/place-query.dto';\r\nimport { PaginatedResponseDto } from '@common/dto/pagination.dto';\r\nimport { NearbyQueryDto } from './core/dto/nearby-query.dto';\r\nimport { NearbyPlaceResponseDto } from './core/dto/nearby-response.dto';\r\n\r\n@Injectable()\r\nexport class PlaceService {\r\n  constructor(\r\n    private readonly prisma: PrismaService,\r\n    @Inject(CACHE_MANAGER) private readonly cacheManager: Cache,\r\n  ) {}\r\n\r\n  private readonly selectSql = Prisma.sql`\r\n      SELECT\r\n        p.\"id\",\r\n        p.\"name\",\r\n        p.\"description\",\r\n        p.\"is_active\",\r\n        p.\"feature_id\",\r\n        p.\"district_id\",\r\n        p.\"user_id\",\r\n        p.\"created_at\",\r\n        p.\"updated_at\",\r\n        p.\"deleted_at\",\r\n        COALESCE(\r\n          json_agg(\r\n            json_build_object(\r\n              'id', f.\"id\",\r\n              'geom', ST_AsGeoJSON(f.\"geom\")::json,\r\n              'name', f.\"name\",\r\n              'properties', f.\"properties\",\r\n              'layer_id', f.\"layer_id\"\r\n            )\r\n          ) FILTER (WHERE f.\"id\" IS NOT NULL),\r\n          '[]'::json\r\n        ) AS \"features\"\r\n      FROM \"places\" p\r\n      LEFT JOIN \"features\" f ON p.\"feature_id\" = f.\"id\"\r\n  `;\r\n\r\n  private readonly groupBySql = Prisma.sql`\r\n      GROUP BY\r\n        p.\"id\",\r\n        p.\"name\",\r\n        p.\"description\",\r\n        p.\"is_active\",\r\n        p.\"feature_id\",\r\n        p.\"district_id\",\r\n        p.\"user_id\",\r\n        p.\"created_at\",\r\n        p.\"updated_at\",\r\n        p.\"deleted_at\"\r\n  `;\r\n\r\n  async create(createPlaceDto: CreatePlaceDto): Promise<PlaceEntity> {\r\n    const { name, description, latitude, longitude, userId, layerId, isActive } = createPlaceDto;\r\n\r\n    const layer = await this.prisma.layer.findUnique({ where: { id: layerId } });\r\n    if (!layer) {\r\n      throw new BadRequestException('Layer not found');\r\n    }\r\n\r\n    const user = await this.prisma.user.findUnique({ where: { id: userId } });\r\n    if (!user) {\r\n      throw new BadRequestException('User not found');\r\n    }\r\n\r\n    const [district] = await this.prisma.$queryRaw<{ id: number }[]>(\r\n      Prisma.sql`\r\n    SELECT d.id\r\n    FROM districts d\r\n    JOIN features f\r\n      ON f.id = d.feature_id\r\n    WHERE ST_Intersects(\r\n      f.geom,\r\n      ST_SetSRID(\r\n        ST_MakePoint(${longitude}, ${latitude}),\r\n        4326\r\n      )\r\n    );\r\n  `,\r\n    );\r\n\r\n    if (!district) {\r\n      throw new BadRequestException('District not found for place location');\r\n    }\r\n\r\n    const existPlace = await this.prisma.place.findFirst({\r\n      where: {\r\n        name,\r\n        user_id: userId,\r\n        deleted_at: null,\r\n      },\r\n    });\r\n\r\n    if (existPlace) {\r\n      throw new ConflictException('Place with the same name already exists');\r\n    }\r\n\r\n    const placeId = await this.prisma.$transaction(async (tx) => {\r\n      const [feature] = await tx.$queryRaw<{ id: number }[]>(\r\n        Prisma.sql`\r\n        INSERT INTO \"features\" (\"geom\", \"name\", \"layer_id\", \"created_at\", \"updated_at\")\r\n        VALUES (\r\n          ST_SetSRID(ST_MakePoint(${longitude}, ${latitude}), 4326),\r\n          ${name},\r\n          ${layerId},\r\n          NOW(),\r\n          NOW()\r\n        )\r\n        RETURNING \"id\"\r\n      `,\r\n      );\r\n\r\n      const place = await tx.place.create({\r\n        data: {\r\n          name,\r\n          description: description ?? null,\r\n          is_active: isActive ?? true,\r\n          district_id: district.id,\r\n          user_id: userId,\r\n          feature_id: feature.id,\r\n        },\r\n      });\r\n\r\n      return place.id;\r\n    });\r\n\r\n    await this.cacheManager.clear();\r\n\r\n    return this.findOne(placeId);\r\n  }\r\n\r\n  async findAll(query: PlaceQueryDto): Promise<PaginatedResponseDto<PlaceEntity>> {\r\n    const { page = 1, limit = 10, search, districtName } = query;\r\n    const skip = (page - 1) * limit;\r\n    const searchTerm = search?.trim();\r\n    const districtNameTerm = districtName?.trim();\r\n\r\n    const searchFilter = searchTerm\r\n      ? Prisma.sql`AND p.\"name\" ILIKE ${`%${searchTerm}%`}`\r\n      : Prisma.sql``;\r\n    const districtFilter = districtNameTerm\r\n      ? Prisma.sql`\r\n          AND EXISTS (\r\n            SELECT 1\r\n            FROM \"districts\" d\r\n            WHERE d.\"id\" = p.\"district_id\"\r\n              AND d.\"deleted_at\" IS NULL\r\n              AND d.\"name\" ILIKE ${`%${districtNameTerm}%`}\r\n          )\r\n        `\r\n      : Prisma.sql``;\r\n    const whereClause = Prisma.sql`\r\n      WHERE p.\"deleted_at\" IS NULL\r\n      ${searchFilter}\r\n      ${districtFilter}\r\n    `;\r\n\r\n    const [places, countResult] = await Promise.all([\r\n      this.prisma.$queryRaw<PlaceEntity[]>(Prisma.sql`\r\n        ${this.selectSql}\r\n        ${whereClause}\r\n        ${this.groupBySql}\r\n        ORDER BY p.\"created_at\" DESC, p.\"id\" DESC\r\n        LIMIT ${limit}\r\n        OFFSET ${skip}\r\n      `),\r\n      this.prisma.$queryRaw<{ total: number }[]>(Prisma.sql`\r\n        SELECT COUNT(*)::int AS \"total\"\r\n        FROM \"places\" p\r\n        ${whereClause}\r\n      `),\r\n    ]);\r\n\r\n    const total = countResult[0]?.total ?? 0;\r\n\r\n    return {\r\n      data: places,\r\n      meta: {\r\n        total,\r\n        page,\r\n        limit,\r\n        totalPages: Math.ceil(total / limit),\r\n      },\r\n    };\r\n  }\r\n\r\n  async findNearby(query: NearbyQueryDto): Promise<PaginatedResponseDto<NearbyPlaceResponseDto>> {\r\n    const { page = 1, limit = 10, latitude, longitude, radius } = query;\r\n\r\n    if (latitude === undefined || longitude === undefined || radius === undefined) {\r\n      return {\r\n        data: [],\r\n        meta: {\r\n          total: 0,\r\n          page,\r\n          limit,\r\n          totalPages: 0,\r\n        },\r\n      };\r\n    }\r\n\r\n    const skip = (page - 1) * limit;\r\n\r\n    const [nearbyPlaces, countResult] = await Promise.all([\r\n      this.prisma.$queryRaw<NearbyPlaceResponseDto[]>(Prisma.sql`\r\n        SELECT\r\n          p.\"id\",\r\n          p.\"name\",\r\n          p.\"description\",\r\n          ST_Distance(\r\n            f.\"geom\"::geography,\r\n            ST_SetSRID(\r\n              ST_MakePoint(${longitude}, ${latitude}),\r\n              4326\r\n            )::geography\r\n          )::float AS \"distance_m\"\r\n        FROM \"places\" p\r\n        JOIN \"features\" f\r\n          ON p.\"feature_id\" = f.\"id\"\r\n        WHERE ST_DWithin(\r\n          f.\"geom\"::geography,\r\n          ST_SetSRID(\r\n            ST_MakePoint(${longitude}, ${latitude}),\r\n            4326\r\n          )::geography,\r\n          ${radius}\r\n        ) AND p.\"deleted_at\" is NULL\r\n        ORDER BY \"distance_m\" ASC\r\n        LIMIT ${limit}\r\n        OFFSET ${skip};\r\n      `),\r\n      this.prisma.$queryRaw<{ total: number }[]>(Prisma.sql`\r\n        SELECT COUNT(*)::int AS \"total\"\r\n        FROM \"places\" p\r\n        JOIN \"features\" f\r\n          ON p.\"feature_id\" = f.\"id\"\r\n        WHERE ST_DWithin(\r\n          f.\"geom\"::geography,\r\n          ST_SetSRID(\r\n            ST_MakePoint(${longitude}, ${latitude}),\r\n            4326\r\n          )::geography,\r\n          ${radius}\r\n        ) AND p.\"deleted_at\" is NULL\r\n      `),\r\n    ]);\r\n\r\n    const total = Number(countResult[0]?.total ?? 0);\r\n\r\n    return {\r\n      data: nearbyPlaces,\r\n      meta: {\r\n import { basicSetup, EditorView } from "codemirror";

const viewerInstances = new Map();

function escHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function makeHighlightPlugin(targetLines, className) {
  const lineDeco = Decoration.line({ attributes: { class: className } });
  return ViewPlugin.fromClass(class {
    constructor(view) {
      this.decorations = this.buildDecos(view);
    }

        }
      }
      return Decoration.set(builder, true);
    }

  }, { decorations: (v) => v.decorations });
}

function makeLineTooltipPlugin(lineMetadata) {
  return hoverTooltip(function(view, pos) {
    const line = view.state.doc.lineAt(pos);
    const lineNum = line.number;
    const entries = lineMetadata[lineNum];
    if (!entries || entries.length === 0) return null;
    return {
      pos: line.from,
      above: true,
      create: function() {
        const dom = document.createElement("div");
        dom.className = "cm-line-tooltip";
        dom.innerHTML = entries.map(function(e) {

            : e.severity === "warning" ? "var(--sev-warning)" : "var(--sev-info)";
          return '<div class="cm-line-tooltip-entry">' +
            '<div class="cm-line-tooltip-header">' +
              '<span class="cm-line-tooltip-dot" style="background:' + sevColor + '"></span>' +
              '<span class="cm-line-tooltip-rule">' + escHtml(e.rule) + '</span>' +
            '</div>' +
            '<span class="cm-line-tooltip-msg">' + escHtml(e.message) + '</span>' +

        return { dom: dom };

    viewerInstances.delete(key);

  const showLineNumbers = options.lineNumbers !== false;
  const highlightLine = options.highlightLine || 0;
  const highlightLines = options.highlightLines || (highlightLine > 0 ? [highlightLine] : []);
  const lineMetadata = options.lineMetadata || null;

    EditorView.editable.of(false),

    javascript({ typescript: true }),
    syntaxHighlighting(defaultHighlightStyle, { fallback: true }),

        overflow: "auto",

      ".cm-highlighted-line": {

        borderLeft: "3px solid #ea2845",
        cursor: "pointer",
      },

        borderLeft: "3px solid #ffffff",
        boxShadow: "inset 0 0 0 1px rgba(255,255,255,0.22)",

  }

    extensions.push(makeHighlightPlugin(highlightLines, "cm-highlighted-line"));
  }

  const hitLines = options.hitLines || [];
  if (hitLines.length > 0) {
    extensions.push(makeHighlightPlugin(hitLines, "cm-hit-line"));
  }

    extensions.push(makeLineTooltipPlugin(lineMetadata));

    extensions: extensions,
