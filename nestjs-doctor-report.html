  font-size: 17px; font-weight: 700; color: var(--white);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.dc-step-num small { font-size: 11px; color: var(--text-dim); font-weight: 400; }
.dc-step-label {
  font-size: 11px; color: var(--text-muted); flex: 1 1 180px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dc-step-label b { color: var(--text); }
.dc-track { flex: 1 1 100%; height: 3px; background: rgba(255,255,255,0.1); }
.dc-track i { display: block; height: 100%; background: var(--nest-red); }

/* ── Depth-tier map ── */
.dc-map-wrap {
  margin: 0 18px 14px; border: 1px solid var(--border);
  flex: 1; min-height: 0; display: flex; flex-direction: column;
}
.dc-map-head {
  flex: none; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding: 7px 12px; border-bottom: 1px solid var(--border);
}
.dc-map-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text); white-space: nowrap;
}
/* The caveat wraps rather than clipping. */
.dc-map-note {
  font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.03em;
  min-width: 0; line-height: 1.45;
}
.dc-map { flex: 1; min-height: 0; overflow: auto; }
.dc-cols { display: flex; align-items: flex-start; min-width: min-content; position: relative; }
.dc-col { width: 250px; flex: none; border-right: 1px solid var(--border); padding: 0 32px 12px; }
.dc-col:last-child { border-right: none; }
.dc-col-head {
  position: sticky; top: 0; z-index: 2; background: #000;
  border-bottom: 1px solid var(--border); padding: 9px 0 8px; margin-bottom: 2px;
}
.dc-col-depth {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--text); text-transform: uppercase;
}
.dc-col-depth span { color: var(--text-dim); font-weight: 400; margin-left: 6px; }
.dc-card {
  display: block; width: 100%; text-align: left; margin-top: 8px; cursor: pointer;
  border: 1px solid var(--border); padding: 6px 8px 7px; color: var(--text);
  position: relative; z-index: 1; background: #000; font-family: var(--font);
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
}
.dc-card:hover { border-color: var(--border-hover); background: var(--surface-hover); }
.dc-card[data-entry="1"] { border-left: 2px solid var(--nest-red); }
.dc-card[data-dimmed="1"] { opacity: 0.3; }
.dc-card[data-step="1"] { border-color: var(--white); background: rgba(255,255,255,0.07); }
/* The selection is what the code pane is showing; it outlives the playhead. */
.dc-card[data-sel="1"] {
  opacity: 1; border-color: var(--white);
  box-shadow: 0 0 0 1px var(--white), 0 0 14px rgba(255,255,255,0.18);
}
.dc-card-l1 { display: flex; align-items: baseline; gap: 6px; }
.dc-card-cls {
  font-size: 11.5px; font-weight: 600; color: var(--text); flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dc-card-d { font-size: 9.5px; color: var(--text-dim); flex: none; font-variant-numeric: tabular-nums; }
.dc-card-l2 { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.dc-card-m {
  font-size: 11px; color: var(--text-muted); flex: 1 1 auto; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dc-tag {
  font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; padding: 1px 4px;
  border: 1px solid var(--border); color: var(--text-dim); flex: none;
}
.dc-tag[data-eff="write"] { color: var(--dc-eff-write); border-color: rgba(239,68,68,0.4); }
.dc-tag[data-eff="read"] { color: var(--dc-eff-read); border-color: rgba(59,130,246,0.4); }
.dc-tag[data-eff="throw"] { color: var(--dc-eff-throw); border-color: rgba(245,158,11,0.4); }
.dc-tag[data-eff="external"] { color: var(--dc-eff-external); border-color: rgba(139,92,246,0.4); }
.dc-card-steps {
  display: block; margin-top: 5px; padding-top: 4px;
  border-top: 1px solid rgba(255,255,255,0.07);
  font-size: 10px; color: var(--text-dim); font-variant-numeric: tabular-nums;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dc-card-steps b { color: var(--text-muted); }
.dc-card-steps[data-off="1"] { color: #4a4a4a; }
.dc-card-entry {
  display: inline-block; margin-top: 5px; font-size: 8.5px; font-weight: 700;
  letter-spacing: 0.08em; color: var(--nest-red);
}

/* ── The wire layer: one path per call site ── */
.dc-wires { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
.dc-wire {
  fill: none; stroke: var(--border-strong); stroke-width: 1.1; opacity: 0.42;
  transition: opacity 0.15s, stroke-width 0.15s;
}
.dc-wire[data-eff="read"] { stroke: var(--dc-eff-read); opacity: 0.62; }
.dc-wire[data-eff="write"] { stroke: var(--dc-eff-write); opacity: 0.62; }
.dc-wire[data-eff="throw"] { stroke: var(--dc-eff-throw); opacity: 0.62; }
.dc-wire[data-eff="external"] { stroke: var(--dc-eff-external); opacity: 0.62; }
.dc-wire[data-sel="1"] { opacity: 0.95; stroke-width: 1.8; }
.dc-wire[data-live="1"] { opacity: 1; stroke-width: 2; animation: dc-march 0.8s linear infinite; }
.dc-wire-head { fill: var(--border-strong); opacity: 0.55; }
.dc-wire-head[data-eff="read"] { fill: var(--dc-eff-read); }
.dc-wire-head[data-eff="write"] { fill: var(--dc-eff-write); }
.dc-wire-head[data-eff="throw"] { fill: var(--dc-eff-throw); }
.dc-wire-head[data-eff="external"] { fill: var(--dc-eff-external); }
.dc-wire-head[data-sel="1"] { opacity: 0.95; }
.dc-wire-head[data-live="1"] { opacity: 1; }
@keyframes dc-march { to { stroke-dashoffset: -140; } }

/* ── The pile: one row per kept step, newest on top ── */
#endpoints-pile {
  border-left: 1px solid var(--border); height: 100%;
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
}
.dc-pile-head {
  flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden;
}
.dc-pile-head .dc-pile-title { color: var(--text); flex: none; }
.dc-pile-head .dc-pile-stat { min-width: 0; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.dc-pile-head b { color: var(--text-muted); }
.dc-pile-scroll {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; min-width: 0;
  margin: 0 12px 12px;
  border-left: 1px solid var(--border-strong); border-right: 1px solid var(--border-strong);
}
.dc-pile-body { position: relative; width: 100%; border-bottom: 2px solid var(--border-strong); }
/* The height is set inline; the line boxes below have to sum to it. */
.dc-block {
  position: absolute; left: 0; right: 0; cursor: pointer;
  display: flex; flex-direction: column; justify-content: center; padding: 8px;
  background: rgba(255,255,255,0.035);
  border: 1px solid rgba(255,255,255,0.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  font-family: var(--font); color: var(--text); text-align: left;
  transition: background 0.15s, border-color 0.15s;
}
.dc-block:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.3); }
.dc-block[data-top="1"] {
  border-color: rgba(255,255,255,0.3);
  border-left: 2px solid var(--nest-red);
  background: rgba(234,40,69,0.08);
}
.dc-block[data-sel="1"] {
  border-color: var(--white); background: rgba(255,255,255,0.11);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), inset 3px 0 0 var(--white);
}
/* The method line wraps instead of clipping. */
.dc-block-m {
  font-size: 12px; font-weight: 600; line-height: 16px; color: var(--text);
  word-break: break-all; white-space: normal; overflow-wrap: anywhere;
}
.dc-block[data-eff] { border-right-width: 2px; }
.dc-block[data-eff="read"] { border-right-color: var(--dc-eff-read); }
.dc-block[data-eff="write"] { border-right-color: var(--dc-eff-write); }
.dc-block[data-eff="throw"] { border-right-color: var(--dc-eff-throw); }
.dc-block[data-eff="external"] { border-right-color: var(--dc-eff-external); }
.dc-block-cls {
  color: rgba(255,255,255,0.6); min-width: 0; flex: 0 1 auto;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dc-block-at { flex: none; font-size: 10px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.dc-block-d { margin-left: auto; }
.dc-block-l2 {
  display: flex; align-items: center; gap: 5px; height: 16px; font-size: 10.5px;
  color: rgba(255,255,255,0.55); overflow: hidden; white-space: nowrap;
}
.dc-block-flags {
  display: flex; align-items: center; gap: 4px; height: 17px;
  overflow: hidden; white-space: nowrap;
}
.dc-block-kind { flex: none; letter-spacing: 0.05em; }
.dc-block-eff { flex: none; font-weight: 700; letter-spacing: 0.05em; }
.dc-block-eff[data-eff="read"] { color: var(--dc-eff-read); }
.dc-block-eff[data-eff="write"] { color: var(--dc-eff-write); }
.dc-block-eff[data-eff="throw"] { color: var(--dc-eff-throw); }
.dc-block-eff[data-eff="external"] { color: var(--dc-eff-external); }
.dc-glyph {
  flex: none; font-size: 9px; letter-spacing: 0.05em; padding: 0 4px; line-height: 14px;
  border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.5);
}
.dc-pile-div {
  position: absolute; left: 0; right: 0; height: 20px;
  display: flex; align-items: center; padding-left: 8px;
  border-top: 1px solid var(--border);
  font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text); opacity: 0.3;
}

/* The block falls in, the one beneath takes the weight, and the red bar
   hands off from the old top to the new. */
.dc-pile-body[data-motion="none"] .dc-block { animation: none !important; }
.dc-block.dc-land { animation: dc-land 0.22s ease-in; }
@keyframes dc-land { from { transform: translateY(-64px); opacity: 0; } to { transform: none; opacity: 1; } }
.dc-block.dc-impact { animation: dc-impact 0.12s ease-out; transform-origin: bottom; }
@keyframes dc-impact { 0% { transform: scaleY(1); } 50% { transform: scaleY(0.96); } 100% { transform: scaleY(1); } }
.dc-block.dc-bar-in { animation: dc-bar-in 0.15s linear; }
@keyframes dc-bar-in {
  from { border-left: 1px solid rgba(255,255,255,0.18); }
  to { border-left: 2px solid var(--nest-red); }
}
.dc-block.dc-bar-out { animation: dc-bar-out 0.15s linear; }
@keyframes dc-bar-out {
  from { border-left: 2px solid var(--nest-red); }
  to { border-left: 1px solid rgba(255,255,255,0.18); }
}
/* After a flight the drop leg waits for the ghost to arrive. */
.dc-pile-body[data-motion="fly"] .dc-block.dc-land { animation: dc-land 0.22s ease-in 0.25s backwards; }
.dc-pile-body[data-motion="fly"] .dc-block.dc-impact,
.dc-pile-body[data-motion="fly"] .dc-block.dc-bar-in,
.dc-pile-body[data-motion="fly"] .dc-block.dc-bar-out { animation-delay: 0.25s; }

/* The flight leg is a fixed ghost on the body, outside the pile scroller. */
.dc-ghost {
  position: fixed; z-index: 60; pointer-events: none; margin: 0;
  animation: dc-fly 0.25s ease-out;
  outline: 1px solid rgba(234,40,69,0.5);
}
@keyframes dc-fly {
  0% { transform: translate(var(--dc-fx, -260px), var(--dc-fy, -120px)) scale(0.55); opacity: 0.35; }
  72% { transform: translate(var(--dc-mx, -130px), var(--dc-my, -200px)) scale(0.86); opacity: 0.85; animation-timing-function: ease-in; }
  100% { transform: translate(0, -64px) scale(1); opacity: 1; outline-color: transparent; }
}

.dc-steps { margin: 0 12px 12px; border: 1px solid var(--border); flex: none; }
.dc-steps > summary {
  list-style: none; cursor: pointer; padding: 9px 12px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-muted);
  transition: background 0.15s, color 0.15s;
}
.dc-steps > summary::-webkit-details-marker { display: none; }
.dc-steps > summary::marker { content: ""; }
.dc-steps > summary:hover { background: var(--surface-hover); color: var(--text); }
.dc-steps[open] > summary { border-bottom: 1px solid var(--border); }
.dc-step-box { max-height: min(34vh, 300px); overflow-y: auto; }
.dc-step-row {
  display: grid; grid-template-columns: 38px 1fr; align-items: baseline;
  width: 100%; text-align: left; background: none; cursor: pointer; color: var(--text);
  font-family: var(--font); padding: 3px 10px 3px 0; border: none;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.dc-step-row:hover { background: var(--surface-hover); }
.dc-step-row[data-step="1"] { background: rgba(255,255,255,0.1); box-shadow: inset 2px 0 0 var(--nest-red); }
.dc-step-n {
  font-size: 10px; color: var(--text-dim); text-align: right; padding-right: 9px;
  font-variant-numeric: tabular-nums;
}
.dc-step-name { font-size: 11.5px; overflow-wrap: anywhere; }
.dc-step-flags { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }

.dc-empty {
  display: flex; align-items: center; justify-content: center; height: 100%;
  color: var(--text-dim); font-size: 13px; text-align: center; padding: 24px;
}
.dc-side-show { padding: 10px 0 0 10px; }

@media (prefers-reduced-motion: reduce) {
  .dc-block, .dc-ghost, .dc-wire { animation: none !important; }
}

/* The endpoints tab keeps its three columns at every width; the side two
   narrow instead of stacking. */
@media (max-width: 1180px) {
  .dc-view { --dc-rail-w: 260px; --dc-pile-w: 280px; --dc-code-max: 54vw; --dc-code-pile: 240px; }
}

@media (max-width: 640px) {
  .summary-grid { grid-template-columns: 1fr; }
  .ov-score-row { flex-direction: column; align-items: flex-start; }
  #detail { width: 100%; }
  #tab-summary { padding: 16px; }
  #diagnosis-sidebar { width: 260px; }
  #diagnosis-main { left: 260px; padding: 16px; }
  #tab-lab { flex-direction: column; }
  .playground-editor { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  .playground-results { width: 100%; }
  #schema-sidebar { width: 260px; min-width: 260px; }
  .dc-view { --dc-rail-w: 220px; --dc-pile-w: 260px; --dc-code-max: 50vw; --dc-code-pile: 210px; }
}</style>

  // Click position only, as a percentage of the viewport. No element is read.
  var clicks = [];
  document.addEventListener("click", function (ev) {
    if (clicks.length >= 200) return;

      y: Math.round((ev.clientY / window.innerHeight) * 1000) / 10,
      tab: activeTabName(),

  });

  function activeTabName() {
    for (var i = 0; i < SECTIONS.length; i++) {
      var el = document.getElementById("tab-" + SECTIONS[i]);
      if (el && el.classList.contains("active")) return SECTIONS[i];
    }
    return "unknown";
  }

  function flush() {
    if (!clicks.length) return;
    send("report_clicks", null, { clicks: clicks.splice(0, clicks.length) });
  }
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") flush();
  });

implements OnModuleInit {\n  onModuleInit() {\n    // ...\n  }\n}"},"correctness/no-empty-handlers":{"bad":"@Controller('users')\nexport class UserController {\n  @Get()\n  findAll() {}  // Empty body\n}","good":"@Controller('users')\nexport class UserController {\n  @Get()\n  findAll() {\n    return this.userService.findAll();\n  }\n}"},"correctness/no-async-without-await":{"bad":"@Injectable()\nexport class UserService {\n  async findAll() {\n    return this.users;  // No await needed\n  }\n}","good":"@Injectable()\nexport class UserService {\n  findAll() {\n    return this.users;\n  }\n\n  // Or, if async is needed:\n  async findById(id: string) {\n    return await this.db.user.findUnique({ where: { id } });\n  }\n}"},"correctness/no-duplicate-module-metadata":{"bad":"@Module({\n  providers: [UserService, AuthService, UserService],  // Duplicate!\n})\nexport class UserModule {}","good":"@Module({\n  providers: [UserService, AuthService],\n})\nexport class UserModule {}"},"correctness/no-missing-module-decorator":{"bad":"export class UserModule {  // Missing @Module()\n  // ...\n}","good":"@Module({\n  controllers: [UserController],\n  providers: [UserService],\n})\nexport class UserModule {}"},"correctness/no-fire-and-forget-async":{"bad":"@Injectable()\nexport class OrderService {\n  complete(orderId: string) {\n    this.notificationService.sendEmail(orderId);  // No await!\n    this.analyticsService.track('order_completed');  // No await!\n  }\n}","good":"@Injectable()\nexport class OrderService {\n  async complete(orderId: string) {\n    await this.notificationService.sendEmail(orderId);\n    await this.analyticsService.track('order_completed');\n  }\n}"},"correctness/factory-inject-matches-params":{"bad":"@Module({\n  providers: [{\n    provide: 'DATA_SOURCE',\n    useFactory: (config: ConfigService) => createDataSource(config),\n    inject: [ConfigService, Logger],  // 2 tokens but 1 param!\n  }],\n})\nexport class AppModule {}","good":"@Module({\n  providers: [{\n    provide: 'DATA_SOURCE',\n    useFactory: (config: ConfigService, logger: Logger) =>\n      createDataSource(config, logger),\n    inject: [ConfigService, Logger],  // 2 tokens, 2 params\n  }],\n})\nexport class AppModule {}"},"correctness/injectable-must-be-provided":{"bad":"@Injectable()\nexport class CacheService {  // Not in any module's providers\n  get(key: string) { /* ... */ }\n}","good":"@Injectable()\nexport class CacheService {\n  get(key: string) { /* ... */ }\n}\n\n@Module({ providers: [CacheService] })\nexport class CacheModule {}"},"correctness/no-duplicate-decorators":{"bad":"@Controller('users')\nexport class UserController {\n  @Get(':id')\n  @Get(':id')  // Duplicate decorator!\n  findOne(@Param('id') id: string) { /* ... */ }\n}","good":"@Controller('users')\nexport class UserController {\n  @Get(':id')\n  findOne(@Param('id') id: string) { /* ... */ }\n}"},"correctness/param-decorator-matches-route":{"bad":"@Controller('users')\nexport class UserController {\n  @Get(':id')\n  findOne(@Param('userId') userId: string) {  // 'userId' not in route\n    return this.userService.findOne(userId);\n  }\n}","good":"@Controller('users')\nexport class UserController {\n  @Get(':id')\n  findOne(@Param('id') id: string) {  // 'id' matches :id in route\n    return this.userService.findOne(id);\n  }\n}"},"correctness/validate-nested-array-each":{"bad":"export class CreateOrderDto {\n  @ValidateNested()  // Missing { each: true } for array\n  @Type(() => OrderItemDto)\n  items: OrderItemDto[];\n}","good":"export class CreateOrderDto {\n  @ValidateNested({ each: true })  // Validates each item in the array\n  @Type(() => OrderItemDto)\n  items: OrderItemDto[];\n}"},"correctness/validated-non-primitive-needs-type":{"bad":"export class CreateUserDto {\n  @ValidateNested()\n  address: AddressDto;  // Missing @Type() — validator can't instantiate\n}","good":"export class CreateUserDto {\n  @ValidateNested()\n  @Type(() => AddressDto)\n  address: AddressDto;\n}"},"architecture/no-business-logic-in-controllers":{"bad":"@Controller('orders')\nexport class OrderController {\n  @Post()\n  create(@Body() dto: CreateOrderDto) {\n    const items = [];\n    for (const item of dto.items) {  // Logic in controller\n      if (item.quantity > 0) {\n        items.push({ ...item, total: item.price * item.quantity });\n      }\n    }\n    return this.orderRepo.save({ items });\n  }\n}","good":"@Controller('orders')\nexport class OrderController {\n  @Post()\n  create(@Body() dto: CreateOrderDto) {\n    return this.orderService.create(dto);\n  }\n}"},"architecture/no-repository-in-controllers":{"bad":"@Controller('users')\nexport class UserController {\n  constructor(\n    @InjectRepository(User)\n    private readonly userRepo: Repository<User>,\n  ) {}\n}","good":"@Controller('users')\nexport class UserController {\n  constructor(private readonly userService: UserService) {}\n}"},"architecture/no-orm-in-controllers":{"bad":"@Controller('users')\nexport class UserController {\n  constructor(private readonly prisma: PrismaService) {}\n\n  @Get()\n  findAll() {\n    return this.prisma.user.findMany();\n  }\n}","good":"@Controller('users')\nexport class UserController {\n  constructor(private readonly userService: UserService) {}\n\n  @Get()\n  findAll() {\n    return this.userService.findAll();\n  }\n}"},"architecture/no-circular-module-deps":{"bad":"// user.module.ts\n@Module({ imports: [OrderModule] })\nexport class UserModule {}\n\n// order.module.ts\n@Module({ imports: [UserModule] })  // Circular!\nexport class OrderModule {}","good":"// shared.module.ts — extract shared logic\n@Module({ providers: [SharedService], exports: [SharedService] })\nexport class SharedModule {}\n\n// user.module.ts\n@Module({ imports: [SharedModule] })\nexport class UserModule {}\n\n// order.module.ts\n@Module({ imports: [SharedModule] })\nexport class OrderModule {}"},"architecture/no-manual-instantiation":{"bad":"@Injectable()\nexport class OrderService {\n  processOrder(order: Order) {\n    const pricing = new PricingService();  // Bypasses the injector\n    return pricing.total(order);\n  }\n}","good":"@Injectable()\nexport class OrderService {\n  constructor(private readonly pricing: PricingService) {}\n\n  processOrder(order: Order) {\n    return this.pricing.total(order);\n  }\n}"},"architecture/no-orm-in-services":{"bad":"@Injectable()\nexport class UserService {\n  constructor(private readonly em: EntityManager) {}\n}","good":"@Injectable()\nexport class UserService {\n  constructor(private readonly userRepo: UserRepository) {}\n}"},"architecture/no-service-locator":{"bad":"@Injectable()\nexport class TaskService {\n  constructor(private readonly moduleRef: ModuleRef) {}\n\n  async run() {\n    const service = this.moduleRef.get(SomeService);\n    service.doWork();\n  }\n}","good":"@Injectable()\nexport class TaskService {\n  constructor(private readonly someService: SomeService) {}\n\n  async run() {\n    this.someService.doWork();\n  }\n}"},"architecture/prefer-constructor-injection":{"bad":"@Injectable()\nexport class UserService {\n  @Inject()\n  private configService: ConfigService;\n}","good":"@Injectable()\nexport class UserService {\n  constructor(private readonly configService: ConfigService) {}\n}"},"architecture/require-module-boundaries":{"bad":"// In user module:\nimport { OrderRepository } from '../order/repositories/order.repository';","good":"// In user module:\nimport { OrderValidator } from '../order';\n// Or better: inject via DI through the module system"},"architecture/no-barrel-export-internals":{"bad":"// user/index.ts\nexport { UserService } from './user.service';\nexport { UserRepository } from './user.repository';  // Internal!","good":"// user/index.ts\nexport { UserService } from './user.service';\n// UserRepository stays internal to the module"},"performance/no-sync-io":{"bad":"@Injectable()\nexport class ConfigService {\n  loadConfig() {\n    const data = readFileSync('config. tjs/config';\r\nimport appConfig from './config/app.config';\r\nimport jwtConfig from './config/jwt.config';\r\nimport { Module } from '@nestjs/common';\r\n\r\n// Common modules\r\nimport { TransformInterceptor } from './common/interceptors/transform.interceptor';\r\nimport { LoggingInterceptor } from './common/interceptors/logging.interceptor';\r\nimport { HttpExceptionFilter } from './common/filters/http-exception.filter';\r\nimport { PermissionsGuard } from './common/guards/permissions.guard';\r\nimport { JwtAuthGuard } from './common/guards/jwt-auth.guard';\r\nimport { PrismaModule } from './common/prisma/prisma.module';\r\n\r\n// Feature modules\r\nimport { HealthModule } from './modules/health/health.module';\r\nimport { UsersModule } from './modules/users/users.module';\r\nimport { AuthModule } from './modules/auth/auth.module';\r\nimport { LayersModule } from './modules/layers/layers.module';\r\nimport { DistrictModule } from '@modules/districts/district.module';\r\nimport { PlaceModule } from '@modules/places/place.module';\r\nimport { seconds, ThrottlerGuard, ThrottlerModule } from '@nestjs/throttler';\r\n\r\n@Module({\r\n  imports: [\r\n    // Configuration\r\n    ConfigModule.forRoot({\r\n      isGlobal: true,\r\n      validationSchema,\r\n      load: [appConfig, databaseConfig, jwtConfig, swaggerConfig],\r\n    }),\r\n\r\n    // Common modules\r\n    PrismaModule,\r\n\r\n    // Feature modules\r\n    AuthModule,\r\n    UsersModule,\r\n    HealthModule,\r\n    DistrictModule,\r\n    PlaceModule,\r\n    LayersModule,\r\n\r\n    //throtle modules\r\n    ThrottlerModule.forRoot({\r\n      throttlers: [\r\n        {\r\n          ttl: seconds(60),\r\n          limit: 10,\r\n        },\r\n      ],\r\n    }),\r\n  ],\r\n  providers: [\r\n    // Global guards\r\n    {\r\n      provide: APP_GUARD,\r\n      useClass: JwtAuthGuard,\r\n    },\r\n    {\r\n      provide: APP_GUARD,\r\n      useClass: PermissionsGuard,\r\n    },\r\n\r\n    // Throttler guard\r\n    {\r\n      provide: APP_GUARD,\r\n      useClass: ThrottlerGuard,\r\n    },\r\n\r\n    {\r\n      provide: APP_GUARD,\r\n      useClass: PermissionsGuard,\r\n    },\r\n\r\n    // Global filters\r\n    {\r\n      provide: APP_FILTER,\r\n      useClass: HttpExceptionFilter,\r\n    },\r\n\r\n    // Global interceptors\r\n    {\r\n      provide: APP_INTERCEPTOR,\r\n      useClass: LoggingInterceptor,\r\n    },\r\n    {\r\n      provide: APP_INTERCEPTOR,\r\n      useClass: TransformInterceptor,\r\n    },\r\n  ],\r\n})\r\nexport class AppModule {}\r\n","D:/CODING/WEB/learn-nest/src/common/constants/permissions.constant.ts":"export const PERMISSIONS = {\n  // User Management\n  USER: {\n    VIEW: 'VIEW_USER',\n    ADD: 'ADD_USER',\n    UPDATE: 'UPDATE_USER',\n    DELETE: 'DELETE_USER',\n    MANAGE_PERMISSION: 'MANAGE_USER_PERMISSION',\n    CHANGE_POSITION: 'CHANGE_USER_POSITION',\n  },\n\n  // Position Management\n  POSITION: {\n    VIEW: 'VIEW_POSITION',\n    ADD: 'ADD_POSITION',\n    UPDATE: 'UPDATE_POSITION',\n    DELETE: 'DELETE_POSITION',\n  },\n\n  // Permission Management\n  PERMISSION: {\n    VIEW: 'VIEW_PERMISSION',\n    ADD: 'ADD_PERMISSION',\n    UPDATE: 'UPDATE_PERMISSION',\n    DELETE: 'DELETE_PERMISSION',\n  },\n\n  DISTRICT : {\n    VIEW: 'VIEW_DISTRICT',\n    ADD: 'ADD_DISTRICT',\n    UPDATE: 'UPDATE_DISTRICT',\n    DELETE: 'DELETE_DISTRICT',\n  },\n\n  PLACE: {\n    VIEW: 'VIEW_PLACE',\n    ADD: 'ADD_PLACE',\n    UPDATE: 'UPDATE_PLACE',\n    DELETE: 'DELETE_PLACE',\n  },\n\n  LAYER: {\n    VIEW: 'VIEW_LAYER',\n    ADD: 'ADD_LAYER',\n    UPDATE: 'UPDATE_LAYER',\n    DELETE: 'DELETE_LAYER',\n  },\n} as const;\n","D:/CODING/WEB/learn-nest/src/common/decorators/api-response.decorator.ts":"import { ApiExtraModels, ApiOkResponse, getSchemaPath } from '@nestjs/swagger';\nimport { ApiResponseDto } from '@common/dto/api-response.dto';\nimport { applyDecorators, Type } from '@nestjs/common';\n\nexport const ApiSuccessResponse = <TModel extends Type<any>>(model: TModel) => {\n  return applyDecorators(\n    ApiExtraModels(ApiResponseDto, model),\n    ApiOkResponse({\n      schema: {\n        allOf: [\n          { $ref: getSchemaPath(ApiResponseDto) },\n          {\n            properties: {\n              data: {\n                $ref: getSchemaPath(model),\n              },\n            },\n          },\n        ],\n      },\n    }),\n  );\n};\n\nexport const ApiSuccessArrayResponse = <TModel extends Type<any>>(model: TModel) => {\n  return applyDecorators(\n    ApiExtraModels(ApiResponseDto, model),\n    ApiOkResponse({\n      schema: {\n        allOf: [\n          { $ref: getSchemaPath(ApiResponseDto) },\n          {\n            properties: {\n              data: {\n                type: 'array',\n                items: { $ref: getSchemaPath(model) },\n              },\n            },\n          },\n        ],\n      },\n    }),\n  );\n};\n","D:/CODING/WEB/learn-nest/src/common/decorators/get-user.decorator.ts":"import { JwtPayload } from '@modules/auth/core/interfaces/jwt-payload.interface';\nimport { createParamDecorator, ExecutionContext } from '@nestjs/common';\n\nexport const GetUser = createParamDecorator(\n  (data: keyof JwtPayload | undefined, ctx: ExecutionContext): JwtPayload | any => {\n    const request = ctx.switchToHttp().getRequest();\n    const user = request.user;\n\n    return data ? user?.[data] : user;\n  },\n);\n","D:/CODING/WEB/learn-nest/src/common/decorators/permissions.decorator.ts":"import { SetMetadata } from '@nestjs/common';\n\nexport const PERMISSIONS_KEY = 'permissions';\nexport const Permissions = (...permissions: string[]) =>\n  SetMetadata(PERMISSIONS_KEY, permissions);\n","D:/CODING/WEB/learn-nest/src/common/decorators/public.decorator.ts":"import { SetMetadata } from '@nestjs/common';\n\nexport const IS_PUBLIC_KEY = 'isPublic';\nexport const Public = () => SetMetadata(IS_PUBLIC_KEY, true);\n","D:/CODING/WEB/learn-nest/src/common/dto/api-response.dto.ts":"import { ApiProperty, ApiPropertyOptional } from '@nestjs/swagger';\n\nexport class ApiResponseDto<T = any> {\n  @ApiProperty({ example: 200 })\n  statusCode: number;\n\n  @ApiProperty({ example: 'Operation successful' })\n  message: string;\n\n  @ApiPropertyOptional()\n  data?: T;\n\n  @ApiPropertyOptional()\n  errors?: any;\n}\n","D:/CODING/WEB/learn-nest/src/common/dto/pagination.dto.ts":"import { IsOptional, IsInt, Min, Max } from 'class-validator';\nimport { ApiPropertyOptional } from '@nestjs/swagger';\nimport { Type } from 'class-transformer';\n\nexport class PaginationDto {\n  @ApiPropertyOptional({ minimum: 1, default: 1 })\n  @Type(() => Number)\n  @IsInt()\n  @Min(1)\n  @IsOptional()\n  page?: number = 1;\n\n  @ApiPropertyOptional({ minimum: 1, maximum: 100, default: 10 })\n  @Type(() => Number)\n  @IsInt()\n  @Min(1)\n  @Max(100)\n  @IsOptional()\n  limit?: number = 10;\n}\n\nexport class PaginatedResponseDto<T> {\n  @ApiPropertyOptional()\n  data: T[];\n\n  @ApiPropertyOptional()\n  meta: {\n    total: number;\n    page: number;\n    limit: number;\n    totalPages: number;\n  };\n}\n","D:/CODING/WEB/learn-nest/src/common/filters/http-exception.filter.ts":"import { ApiResponseDto } from '@common/dto/api-response.dto';\nimport { Response } from 'express';\nimport {\n  Catch,\n  Logger,\n  HttpStatus,\n  ArgumentsHost,\n  HttpException,\n  ExceptionFilter,\n} from '@nestjs/common';\n\n@Catch()\nexport class HttpExceptionFilter implements ExceptionFilter {\n  private readonly logger = new Logger(HttpExceptionFilter.name);\n\n  catch(exception: unknown, host: ArgumentsHost) {\n    const ctx = host.switchToHttp();\n    const response = ctx.getResponse<Response>();\n    const request = ctx.getRequest<Request>();\n\n    let status = HttpStatus.INTERNAL_SERVER_ERROR;\n    let message = 'Internal server error';\n    let errors: any = null;\n\n    if (exception instanceof HttpException) {\n      status = exception.getStatus();\n      const exceptionResponse = exception.getResponse();\n\n      if (typeof exceptionResponse === 'object' && exceptionResponse !== null) {\n        message = (exceptionResponse as any).message || exception.message;\n        errors = (exceptionResponse as any).errors || null;\n      } else {\n        message = exceptionResponse as string;\n      }\n    } else if (exception instanceof Error) {\n      message = exception.message;\n    }\n\n    // Log error for monitoring\n    this.logger.error(\n      `${request.method} ${request.url} - Status: ${status} - Message: ${message}`,\n      exception instanceof Error ? exception.stack : undefined,\n    );\n\n    const errorResponse: ApiResponseDto<null> = {\n      statusCode: status,\n      message,\n      data: null,\n      errors,\n    };\n\n    response.status(status).json(errorResponse);\n  }\n}\n","D:/CODING/WEB/learn-nest/src/common/guards/jwt-auth.guard.ts":"import { ExecutionContext, Injectable, UnauthorizedException } from '@nestjs/common';\nimport { IS_PUBLIC_KEY } from '@common/decorators/public.decorator';\nimport { AuthGuard } from '@nestjs/passport';\nimport { Reflector } from '@nestjs/core';\nimport { Observable } from 'rxjs';\n\n@Injectable()\nexport class JwtAuthGuard extends AuthGuard('jwt') {\n  constructor(private reflector: Reflector) {\n    super();\n  }\n\n  canActivate(context: ExecutionContext): boolean | Promise<boolean> | Observable<boolean> {\n    const isPublic = this.reflector.getAllAndOverride<boolean>(IS_PUBLIC_KEY, [\n      context.getHandler(),\n      context.getClass(),\n    ]);\n\n    if (isPublic) {\n      return true;\n    }\n\n    return super.canActivate(context);\n  }\n\n  handleRequest(err: any, user: any, info: any) {\n    if (err || !user) {\n      throw err || new UnauthorizedException('Invalid or expired token');\n    }\n    return user;\n  }\n}\n","D:/CODING/WEB/learn-nest/src/common/guards/permissions.guard.ts":"import { Injectable, CanActivate, ExecutionContext, ForbiddenException } from '@nestjs/common';\nimport { JwtPayload } from '@modules/auth/core/interfaces/jwt-payload.interface';\nimport { PERMISSIONS_KEY } from '@common/decorators/permissions.decorator';\nimport { IS_PUBLIC_KEY } from '@common/decorators/public.decorator';\nimport { Reflector } from '@nestjs/core';\n\n@Injectable()\nexport class PermissionsGuard implements CanActivate {\n  constructor(private reflector: Reflector) {}\n\n  canActivate(context: ExecutionContext): boolean {\n    // Check if route is public\n    const isPublic = this.reflector.getAllAndOverride<boolean>(IS_PUBLIC_KEY, [\n      context.getHandler(),\n      context.getClass(),\n    ]);\n\n    if (isPublic) {\n      return true;\n    }\n\n    // Get required permissions from decorator\n    const requiredPermissions = this.reflector.getAllAndOverride<string[]>(PERMISSIONS_KEY, [\n      context.getHandler(),\n      context.getClass(),\n    ]);\n\n    if (!requiredPermissions || requiredPermissions.length === 0) {\n      return true;\n    }\n\n    // Get user from request\n    const request = context.switchToHttp().getRequest();\n    const user: JwtPayload = request.user;\n\n    if (!user) {\n      throw new ForbiddenException('User not authenticated');\n    }\n\n    // Check if user has required permissions\n    const hasPermission = requiredPermissions.every((permission) =>\n      user.permissions.includes(permission),\n    );\n\n    if (!hasPermission) {\n      throw new ForbiddenException(\n        `You do not have the required permissions: ${requiredPermissions.join(', ')}`,\n      );\n    }\n\n    return true;\n  }\n}\n","D:/CODING/WEB/learn-nest/src/common/helpers/function/error-helper.ts":"import { Prisma } from '@prisma/client';\n\nexport function getErrorMessage(error: unknown): string {\n  if (error instanceof Error) {\n    return error.message;\n  }\n\n  // Prisma known error\n  if (error instanceof Prisma.PrismaClientKnownRequestError) {\n    return (error as any).message;\n  }\n\n  // Prisma validation error\n  if (error instanceof Prisma.PrismaClientValidationError) {\n    return (error as any).message;\n  }\n\n  // String thrown\n  if (typeof error === 'string') {\n    return error;\n  }\n\n  // Object with message\n  if (\n    typeof error === 'object' &&\n    error !== null &&\n    'message' in error &&\n    typeof (error as any).message === 'string'\n  ) {\n    return (error as any).message;\n  }\n\n  // Fallback\n  return 'Unexpected error occurred';\n}\n","D:/CODING/WEB/learn-nest/src/common/interceptors/logging.interceptor.ts":"import { Injectable, NestInterceptor, ExecutionContext, CallHandler, Logger } from '@nestjs/common';\nimport { tap } from 'rxjs/operators';\nimport { Observable } from 'rxjs';\n\n@Injectable()\nexport class LoggingInterceptor implements NestInterceptor {\n  private readonly logger = new Logger('HTTP');\n\n  intercept(context: ExecutionContext, next: CallHandler): Observable<any> {\n    const request = context.switchToHttp().getRequest();\n    const { method, url, body, user } = request;\n    const now = Date.now();\n\n    const userId = user?.userId || 'anonymous';\n\n    this.logger.log(\n      `→ [${method}] ${url} - User: ${userId} ${\n        Object.keys(body || {}).length > 0 ? `- Body: ${JSON.stringify(body)}` : ''\n      }`,\n    );\n\n    return next.handle().pipe(\n      tap({\n        next: () => {\n          const responseTime = Date.now() - now;\n          this.logger.log(`← [${method}] ${url} - ${responseTime}ms - User: ${userId}`);\n        },\n        error: (error) => {\n          const responseTime = Date.now() - now;\n          this.logger.error(\n            `← [${method}] ${url} - ${responseTime}ms - User: ${userId} - Error: ${error.message}`,\n          );\n        },\n      }),\n    );\n  }\n}\n","D:/CODING/WEB/learn-nest/src/common/interceptors/transform.interceptor.ts":"import { ApiResponseDto } from '@common/dto/api-response.dto';\nimport { map } from 'rxjs/operators';\nimport { Observable } from 'rxjs';\nimport {\n  Injectable,\n  HttpStatus,\n  CallHandler,\n  NestInterceptor,\n  ExecutionContext,\n} from '@nestjs/common';\n\n@Injectable()\nexport class TransformInterceptor<T> implements NestInterceptor<T, ApiResponseDto<T>> {\n  intercept(context: ExecutionContext, next: CallHandler): Observable<ApiResponseDto<T>> {\n    const request = context.switchToHttp().getRequest();\n    const response = context.switchToHttp().getResponse();\n\n    return next.handle().pipe(\n      map((data) => {\n        // If data is already in ApiResponseDto format, return as is\n        if (data && typeof data === 'object' && 'statusCode' in data && 'message' in data) {\n          return data;\n        }\n\n        // Default success message based on HTTP method\n        let message = 'Operation successful';\n\n        switch (request.method) {\n          case 'POST':\n            message = 'Resource created successfully';\n            break;\n          case 'PUT':\n          case 'PATCH':\n            message = 'Resource updated successfully';\n            break;\n          case 'DELETE':\n            message = 'Resource deleted successfully';\n            break;\n          case 'GET':\n            message = 'Data retrieved successfully';\n            break;\n        }\n\n        return {\n          statusCode: response.statusCode || HttpStatus.OK,\n          message,\n          data,\n        };\n      }),\n    );\n  }\n}\n","D:/CODING/WEB/learn-nest/src/common/pipes/district-geomtype.pipe.ts":"import { BadRequestException, Injectable, PipeTransform } from '@nestjs/common';\r\n\r\ntype Position = number[];\r\n\r\n@Injectable()\r\nexport class DistrictGeomTypePipe\r\n  implements PipeTransform<Record<string, unknown> | undefined, string | undefined>\r\n{\r\n  transform(geoJson?: Record<string, unknown>): string | undefined {\r\n    if (!geoJson) {\r\n      return undefined;\r\n    }\r\n\r\n    if (geoJson.type !== 'Polygon' && geoJson.type !== 'MultiPolygon') {\r\n      throw new BadRequestException('District geometry must be a Polygon or MultiPolygon');\r\n    }\r\n\r\n    if (geoJson.type === 'Polygon') {\r\n      this.validatePolygon(geoJson.coordinates);\r\n    } else {\r\n      if (!Array.isArray(geoJson.coordinates) || geoJson.coordinates.length === 0) {\r\n        throw new BadRequestException('MultiPolygon must contain at least one polygon');\r\n      }\r\n      geoJson.coordinates.forEach((polygon) => this.validatePolygon(polygon));\r\n    }\r\n\r\n    return JSON.stringify(geoJson);\r\n  }\r\n\r\n  private validatePolygon(coordinates: unknown): void {\r\n    if (!Array.isArray(coordinates) || coordinates.length === 0) {\r\n      throw new BadRequestException('Polygon must contain at least one linear ring');\r\n    }\r\n\r\n    coordinates.forEach((ring) => this.validateRing(ring));\r\n  }\r\n\r\n  private validateRing(ring: unknown): void {\r\n    if (!Array.isArray(ring) || ring.length < 4) {\r\n      throw new BadRequestException('Each polygon ring must contain at least four positions');\r\n    }\r\n\r\n    ring.forEach((position) => this.validatePosition(position));\r\n\r\n    const first = ring[0] as Position;\r\n    const last = ring[ring.length - 1] as Position;\r\n    if (first.length !== last.length || first.some((coordinate, index) => coordinate !== last[index])) {\r\n      throw new BadRequestException('Each polygon ring must be closed');\r\n    }\r\n  }\r\n\r\n  private validatePosition(position: unknown): asserts position is Position {\r\n    if (\r\n      !Array.isArray(position) ||\r\n      position.length < 2 ||\r\n      !position.every((coordinate) => typeof coordinate === 'number' && Number.isFinite(coordinate)) ||\r\n      position[0] < -180 ||\r\n      position[0] > 180 ||\r\n      position[1] < -90 ||\r\n      position[1] > 90\r\n    ) {\r\n      throw new BadRequestException('Coordinates must contain valid longitude and latitude values');\r\n    }\r\n  }\r\n}\r\n","D:/CODING/WEB/learn-nest/src/common/pipes/geojson-file.pipe.ts":"import { BadRequestException, Injectable, PipeTransform } from '@nestjs/common';\r\nimport { extname } from 'node:path';\r\n\r\nconst geometryTypes = new Set([\r\n  'Point',\r\n  'MultiPoint',\r\n  'LineString',\r\n  'MultiLineString',\r\n  'Polygon',\r\n  'MultiPolygon',\r\n  'GeometryCollection',\r\n]);\r\n\r\n@Injectable()\r\nexport class GeoJsonFilePipe\r\n  implements PipeTransform<Express.Multer.File | undefined, Record<string, unknown> | undefined>\r\n{\r\n  transform(file?: Express.Multer.File): Record<string, unknown> | undefined {\r\n    if (!file) {\r\n      return undefined;\r\n    }\r\n\r\n    const extension = extname(file.originalname).toLowerCase();\r\n    if (extension !== '.geojson' && extension !== '.json') {\r\n      throw new BadRequestException('Only .geojson or .json files are accepted');\r\n    }\r\n\r\n    let geoJson: Record<string, unknown>;\r\n    try {\r\n      const parsed: unknown = JSON.parse(file.buffer.toString('utf8'));\r\n      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {\r\n        throw new Error('GeoJSON must be an object');\r\n      }\r\n      geoJson = parsed as Record<string, unknown>;\r\n    } catch {\r\n      throw new BadRequestException('The uploaded file is not valid JSON');\r\n    }\r\n\r\n    if (!geometryTypes.has(typeof geoJson.type === 'string' ? geoJson.type : '')) {\r\n      throw new BadRequestException('The uploaded file must contain a valid GeoJSON geometry');\r\n    }\r\n\r\n    return geoJson;\r\n  }\r\n}\r\n","D:/CODING/WEB/learn-nest/src/common/prisma/prisma.module.ts":"import { PrismaService } from './prisma.service';\nimport { Global, Module } from '@nestjs/common';\n\n@Global()\n@Module({\n  providers: [PrismaService],\n  exports: [PrismaService],\n})\nexport class PrismaModule {}\n","D:/CODING/WEB/learn-nest/src/common/prisma/prisma.service.ts":"import { Injectable, OnModuleInit, OnModuleDestroy, Logger } from '@nestjs/common';\nimport { PrismaClient } from '@prisma/client';\nimport { PrismaPg } from '@prisma/adapter-pg';\ni lizerInterceptor } from '@nestjs/common';\nimport { SwaggerModule, DocumentBuilder } from '@nestjs/swagger';\nimport { NestFactory, Reflector } from '@nestjs/core';\nimport { ConfigService } from '@nestjs/config';\nimport cookieParser = require('cookie-parser');\nimport { AppModule } from './app.module';\n\nasync function bootstrap() {\n  const app = await NestFactory.create(AppModule);\n\n  const configService = app.get(ConfigService);\n\n  // Get configurations\n  const swaggerEnabled = configService.get<boolean>('swagger.enabled');\n  const corsOrigin = configService.get<string>('app.corsOrigin');\n  const swaggerPath = configService.get<string>('swagger.path');\n  const apiPrefix = configService.get<string>('app.apiPrefix');\n  const port = configService.get<number>('app.port');\n\n  // Enable CORS\n  app.enableCors({\n    origin: corsOrigin,\n    credentials: true,\n  });\n\n  app.use(cookieParser());\n\n  // Global prefix\n  app.setGlobalPrefix(apiPrefix);\n\n  // API Versioning\n  app.enableVersioning({\n    type: VersioningType.URI,\n    defaultVersion: '1',\n  });\n\n  // Global validation pipe\n  app.useGlobalPipes(\n    new ValidationPipe({\n      whitelist: true,\n      forbidNonWhitelisted: true,\n      transform: true,\n      transformOptions: {\n        enableImplicitConversion: true,\n      },\n    }),\n  );\n\n  // Class serializer for excluding fields (like password)\n  app.useGlobalInterceptors(new ClassSerializerInterceptor(app.get(Reflector)));\n\n  // Swagger Documentation\n  if (swaggerEnabled) {\n    const config = new DocumentBuilder()\n      .setTitle('learn-nest API')\n      .setDescription('learn-nest Backend API Documentation')\n      .setVersion('1.0')\n      .addTag('Authentication', 'Authentication endpoints')\n      .addTag('Users', 'User management endpoints')\n      .addTag('Health', 'Health check endpoints')\n      .build();\n\n    const document = SwaggerModule.createDocument(app, config);\n    SwaggerModule.setup(swaggerPath, app, document, {\n      useGlobalPrefix: true,\n      swaggerOptions: {\n        persistAuthorization: true,\n        defaultModelsExpandDepth: -1,\n      },\n    });\n  }\n\n  await app.listen(port);\n\n  console.log(`\\n🚀 Application is running on: http://localhost:${port}/`);\n  console.log(`🌍 Environment: ${configService.get<string>('app.env')}\\n`);\n  if (swaggerEnabled) {\n    console.log(`📚 Swagger Documentaion on : http://localhost:${port}/api/${swaggerPath}`);\n  }\n  console.log(`📊 Health check: http://localhost:${port}/health`);\n  console.log(`🏓 Ping endpoint: http://localhost:${port}/ping\\n`);\n}\n\nbootstrap();\n","D:/CODING/WEB/learn-nest/src/modules/auth/auth.module.ts":"import { Module } from '@nestjs/common';\nimport { JwtModule } from '@nestjs/jwt';\nimport { PassportModule } from '@nestjs/passport';\nimport { ConfigModule, ConfigService } from '@nestjs/config';\nimport { AuthService } from './auth.service';\nimport { AuthController } from './controllers/v1/auth.controller';\nimport { JwtStrategy } from './core/strategies/jwt.strategy';\nimport { JwtRefreshStrategy } from './core/strategies/jwt-refresh.strategy';\nimport type { StringValue } from 'ms';\n\n@Module({\n  imports: [\n    PassportModule.register({ defaultStrategy: 'jwt' }),\n    JwtModule.registerAsync({\n      imports: [ConfigModule],\n      inject: [ConfigService],\n      useFactory: (configService: ConfigService) => ({\n        secret: configService.get<string>('jwt.secret'),\n        signOptions: {\n          expiresIn: configService.get('jwt.expiresIn', '7d') as StringValue,\n        },\n      }),\n    }),\n  ],\n  controllers: [AuthController],\n  providers: [AuthService, JwtStrategy, JwtRefreshStrategy],\n  exports: [JwtStrategy, PassportModule, JwtModule],\n})\nexport class AuthModule {}\n","D:/CODING/WEB/learn-nest/src/modules/auth/auth.service.ts":"import {\n  Injectable,\n  UnauthorizedException,\n  ConflictException,\n  BadRequestException,\n} from '@nestjs/common';\nimport { randomUUID } from 'node:crypto';\nimport { JwtService } from '@nestjs/jwt';\nimport { ConfigService } from '@nestjs/config';\nimport { PrismaService } from '@common/prisma/prisma.service';\nimport { PasswordUtil } from '@common/utils/password.util';\nimport { LoginDto } from './core/dto/login.dto';\nimport { RegisterDto } from './core/dto/register.dto';\nimport { AuthResponseDto } from './core/dto/auth-response.dto';\nimport { JwtPayload } from './core/interfaces/jwt-payload.interface';\nimport type { StringValue } from 'ms';\n\ninterface AuthResult {\n  accessToken: string;\n  refreshToken: string;\n  user: AuthResponseDto['user'];\n}\n\n@Injectable()\nexport class AuthService {\n  constructor(\n    private prisma: PrismaService,\n    private jwtService: JwtService,\n    private configService: ConfigService,\n  ) {}\n\n  private buildPayload(user: {\n    id: number;\n    email: string;\n    position: {\n      id: number;\n      name: string;\n      position_permissions: { permission: { name: string } }[];\n    };\n  }): JwtPayload {\n    const permissions = user.position.position_permissions.map(\n      (pp) => pp.permission.name,\n    );\n\n    return {\n      userId: user.id,\n      email: user.email,\n      positionId: user.position.id,\n      positionName: user.position.name,\n      permissions,\n    };\n  }\n\n  private buildTokens(payload: JwtPayload): { accessToken: string; refreshToken: string } {\n    return {\n      accessToken: this.jwtService.sign(payload, { jwtid: randomUUID() }),\n      refreshToken: this.jwtService.sign(payload, {\n        secret: this.configService.get<string>('jwt.refreshSecret'),\n        expiresIn: this.configService.get('jwt.refreshExpiresIn', '30d') as StringValue,\n        jwtid: randomUUID(),\n      }),\n    };\n  }\n\n  async login(loginDto: LoginDto): Promise<AuthResult> {\n    const { email, password } = loginDto;\n\n    const user = await this.prisma.user.findUnique({\n      where: { email },\n      include: {\n        position: {\n          include: {\n            position_permissions: {\n              include: {\n                permission: true,\n              },\n            },\n          },\n        },\n      },\n    });\n\n    if (!user) {\n      throw new UnauthorizedException('Invalid credentials');\n    }\n\n    if (!user.is_active) {\n      throw new UnauthorizedException('Account is inactive');\n    }\n\n    const isPasswordValid = await PasswordUtil.compare(password, user.password);\n    if (!isPasswordValid) {\n      throw new UnauthorizedException('Invalid credentials');\n    }\n\n    const payload = this.buildPayload(user);\n    const { accessToken, refreshToken } = this.buildTokens(payload);\n\n    return {\n      accessToken,\n      refreshToken,\n      user: {\n        id: user.id,\n        email: user.email,\n        first_name: user.first_name,\n        last_name: user.last_name,\n        position: {\n          id: user.position.id,\n          name: user.position.name,\n        },\n        permissions: payload.permissions,\n      },\n    };\n  }\n\n  async register(registerDto: RegisterDto): Promise<AuthResult> {\n    const { email, password, first_name, last_name, position_id } = registerDto;\n\n    const existingUser = await this.prisma.user.findUnique({\n      where: { email },\n    });\n\n    if (existingUser) {\n      throw new ConflictException('Email already exists');\n    }\n\n    const position = await this.prisma.position.findUnique({\n      where: { id: position_id },\n      include: {\n        position_permissions: {\n          include: {\n            permission: true,\n          },\n        },\n      },\n    });\n\n    if (!position) {\n      throw new BadRequestException('Invalid position ID');\n    }\n\n    const hashedPassword = await PasswordUtil.hash(password);\n\n    const user = await this.prisma.user.create({\n      data: {\n        email,\n        password: hashedPassword,\n        first_name,\n        last_name,\n        position_id,\n      },\n      include: {\n        position: {\n          include: {\n            position_permissions: {\n              include: {\n                permission: true,\n              },\n            },\n          },\n        },\n      },\n    });\n\n    const payload = this.buildPayload(user);\n    const { accessToken, refreshToken } = this.buildTokens(payload);\n\n    return {\n      accessToken,\n      refreshToken,\n      user: {\n        id: user.id,\n        email: user.email,\n        first_name: user.first_name,\n        last_name: user.last_name,\n        position: {\n          id: user.position.id,\n          name: user.position.name,\n        },\n        permissions: payload.permissions,\n      },\n    };\n  }\n\n  async refresh(refreshToken: string): Promise<AuthResult> {\n    let payload: JwtPayload;\n\n    try {\n      payload = this.jwtService.verify(refreshToken, {\n        secret: this.configService.get<string>('jwt.refreshSecret'),\n      });\n    } catch {\n      throw new UnauthorizedException('Invalid or expired refresh token');\n    }\n\n    const user = await this.prisma.user.findUnique({\n      where: { id: payload.userId },\n      include: {\n        position: {\n          include: {\n            position_permissions: {\n              include: {\n                permission: true,\n              },\n            },\n          },\n        },\n      },\n    });\n\n    if (!user || !user.is_active) {\n      throw new UnauthorizedException('User not found or inactive');\n    }\n\n    const freshPayload = this.buildPayload(user);\n    const tokens = this.buildTokens(freshPayload);\n\n    return {\n      accessToken: tokens.accessToken,\n      refreshToken: tokens.refreshToken,\n      user: {\n        id: user.id,\n        email: user.email,\n        first_name: user.first_name,\n        last_name: user.last_name,\n        position: {\n          id: user.position.id,\n          name: user.position.name,\n        },\n        permissions: freshPayload.permissions,\n      },\n    };\n  }\n}\n","D:/CODING/WEB/learn-nest/src/modules/auth/controllers/v1/auth.controller.ts":"import { Controller, Post, Body, HttpCode, HttpStatus, UseGuards, Res, Req } from '@nestjs/common';\nimport { Request, Response } from 'express';\nimport { ApiTags, ApiOperation, ApiResponse, ApiCookieAuth } from '@nestjs/swagger';\nimport { AuthService } from '../../auth.service';\nimport { LoginDto } from '../../core/dto/login.dto';\nimport { RegisterDto } from '../../core/dto/register.dto';\nimport { AuthResponseDto } from '../../core/dto/auth-response.dto';\nimport { Public } from '@common/decorators/public.decorator';\nimport { ApiSuccessResponse } from '@common/decorators/api-response.decorator';\nimport { JwtAuthGuard } from '@common/guards/jwt-auth.guard';\nimport { PermissionsGuard } from '@common/guards/permissions.guard';\nimport { JwtRefreshGuard } from '../../core/guards/jwt-refresh.guard';\nimport { JwtPayload } from '../../core/interfaces/jwt-payload.interface';\n\nconst durationToMs = (duration: string): number => {\n  const match = /^(\\d+)([smhd])$/.exec(duration.trim());\n  if (!match) return 7 * 24 * 60 * 60 * 1000;\n\n  const value = parseInt(match[1], 10);\n  const unitMs: Record<string, number> = {\n    s: 1000,\n    m: 60 * 1000,\n    h: 60 * 60 * 1000,\n    d: 24 * 60 * 60 * 1000,\n  };\n\n  return value * unitMs[match[2]];\n};\n\n@ApiTags('Authentication')\n@Controller({ path: 'auth', version: '1' })\n@UseGuards(JwtAuthGuard, PermissionsGuard)\nexport class AuthController {\n  constructor(private readonly authService: AuthService) {}\n\n  private setAuthCookies(res: Response, accessToken: string, refreshToken: string) {\n    const maxAge = durationToMs(process.env.JWT_EXPIRATION || '7d');\n    const refreshMaxAge = durationToMs(process.env.JWT_REFRESH_EXPIRATION || '30d');\n    const secure = process.env.NODE_ENV === 'production';\n\n    res.cookie('Authentication', accessToken, {\n      httpOnly: true,\n      secure,\n      sameSite: 'lax',\n      maxAge,\n    });\n\n    res.cookie('Refresh', refreshToken, {\n      httpOnly: true,\n      secure,\n      sameSite: 'lax',\n      path: '/api/v1/auth',\n      maxAge: refreshMaxAge,\n    });\n  }\n\n  private clearAuthCookies(res: Response) {\n    const secure = process.env.NODE_ENV === 'production';\n\n    res.cookie('Authentication', '', {\n      httpOnly: true,\n      secure,\n      sameSite: 'lax',\n      expires: new Date(0),\n    });\n\n    res.cookie('Refresh', '', {\n      httpOnly: true,\n      secure,\n      sameSite: 'lax',\n      path: '/api/v1/auth',\n      expires: new Date(0),\n    });\n  }\n\n  @Public()\n  @Post('login')\n  @HttpCode(HttpStatus.OK)\n  @ApiOperation({ summary: 'User login (session via httpOnly cookies)' })\n  @ApiCookieAuth('Authentication')\n  @ApiSuccessResponse(AuthResponseDto)\n  @ApiResponse({ status: 401, description: 'Invalid credentials' })\n  async login(\n    @Body() loginDto: LoginDto,\n    @Res({ passthrough: true }) res: Response,\n  ): Promise<AuthResponseDto> {\n    const { accessToken, refreshToken, user } = await this.authService.login(loginDto);\n    this.setAuthCookies(res, accessToken, refreshToken);\n    return { user };\n  }\n\n  @Public()\n  @Post('register')\n  @ApiOperation({ summary: 'User registration (session via httpOnly cookies)' })\n  @ApiCookieAuth('Authentication')\n  @ApiSuccessResponse(AuthResponseDto)\n  @ApiResponse({ status: 409, description: 'Email already exists' })\n  async register(\n    @Body() registerDto: RegisterDto,\n    @Res({ passthrough: true }) res: Response,\n  ): Promise<AuthResponseDto> {\n    const { accessToken, refreshToken, user } = await this.authService.register(registerDto);\n    this.setAuthCookies(res, accessToken, refreshToken);\n    return { user };\n  }\n\n  @Public()\n  @Post('refresh')\n  @UseGuards(JwtRefreshGuard)\n  @HttpCode(HttpStatus.OK)\n  @ApiOperation({ summary: 'Refresh session (rotates access & refresh cookies)' })\n  @ApiCookieAuth('Refresh')\n  @ApiSuccessResponse(AuthResponseDto)\n  @ApiResponse({ status: 401, description: 'Invalid or expired refresh token' })\n  async refresh(\n    @Req() req: Request,\n    @Res({ passthrough: true }) res: Response,\n  ): Promise<AuthResponseDto> {\n    const payload = req.user as JwtPayload;\n    const { accessToken, refreshToken, user } = await this.authService.refresh(\n      (req.cookies as any).Refresh,\n    );\n    this.setAuthCookies(res, accessToken, refreshToken);\n    return { user };\n  }\n\n  @Post('logout')\n  @HttpCode(HttpStatus.OK)\n  @ApiOperation({ summary: 'User logout (clears session cookies)' })\n  @ApiSuccessResponse(AuthResponseDto)\n  async logout(@Res({ passthrough: true }) res: Response) {\n    this.clearAuthCookies(res);\n    return { message: 'Logout successful' };\n  }\n}\n","D:/CODING/WEB/learn-nest/src/modules/auth/core/dto/auth-response.dto.ts":"import { ApiProperty } from '@nestjs/swagger';\n\nexport class AuthResponseDto {\n  @ApiProperty()\n  user: {\n    id: number;\n    email: string;\n    first_name: string;\n    last_name: string;\n    position: {\n      id: number;\n      name: string;\n    };\n    permissions: string[];\n  };\n}\n","D:/CODING/WEB/learn-nest/src/modules/auth/core/dto/login-response.dto.ts":"import { ApiProperty } from '@nestjs/swagger';\nimport { UserResponseDto } from '@modules/users/core/dto/user-response.dto';\n\nexport class LoginResponseDto {\n  @ApiProperty()\n  access_token: string;\n\n  @ApiProperty()\n  user: UserResponseDto;\n}\n","D:/CODING/WEB/learn-nest/src/modules/auth/core/dto/login.dto.ts":"import { ApiProperty } from '@nestjs/swagger';\nimport { IsEmail, IsNotEmpty, IsString, MinLength } from 'class-validator';\n\nexport class LoginDto {\n  @ApiProperty({ example: 'admin@kulidigital.com' })\n  @IsEmail({}, { message: 'Please provide a valid email address' })\n  @IsNotEmpty({ message: 'Email is required' })\n  email: string;\n\n  @ApiProperty({ example: 'password123' })\n  @IsString()\n  @IsNotEmpty({ message: 'Password is required' })\n  @MinLength(6, { message: 'Password must be at least 6 characters long' })\n  password: string;\n}\n","D:/CODING/WEB/learn-nest/src/modules/auth/core/dto/register.dto.ts":"import { ApiProperty } from '@nestjs/swagger';\nimport { IsEmail, IsNotEmpty, IsString, MinLength, IsInt } from 'class-validator';\n\nexport class RegisterDto {\n  @ApiProperty({ example: 'bhagaskoro@kulidigital.com' })\n  @IsEmail({}, { message: 'Please provide a valid email address' })\n  @IsNotEmpty({ message: 'Email is required' })\n  email: string;\n\n  @ApiProperty({ example: 'password123' })\n  @IsString()\n  @IsNotEmpty({ message: 'Password is required' })\n  @MinLength(6, { message: 'Password must be at least 6 characters long' })\n  password: string;\n\n  @ApiProperty({ example: 'Bhagas' })\n  @IsString()\n  @IsNotEmpty({ message: 'First name is required' })\n  first_name: string;\n\n  @ApiProperty({ example: 'Koro' })\n  @IsString()\n  @IsNotEmpty({ message: 'Last name is required' })\n  last_name: string;\n\n  @ApiProperty({ example: 2, description: 'Position ID' })\n  @IsInt({ message: 'Position ID must be an integer' })\n  @IsNotEmpty({ message: 'Position ID is required' })\n  position_id: number;\n}\n","D:/CODING/WEB/learn-nest/src/modules/auth/core/guards/jwt-refresh.guard.ts":"import { Injectable } from '@nestjs/common';\nimport { AuthGuard } from '@nestjs/passport';\n\n@Injectable()\nexport class JwtRefreshGuard extends AuthGuard('jwt-refresh') {}\n","D:/CODING/WEB/learn-nest/src/modules/auth/core/interfaces/jwt-payload.interface.ts":"export interface JwtPayload {\n  userId: number;\n  email: string;\n  positionId: number;\n  positionName: string;\n  permissions: string[];\n}\n","D:/CODING/WEB/learn-nest/src/modules/auth/core/strategies/jwt-refresh.strategy.ts":"import { Injectable, UnauthorizedException } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { PassportStrategy } from '@nestjs/passport';\nimport { Strategy } from 'passport-jwt';\nimport { Request } from 'express';\nimport { PrismaService } from '@common/prisma/prisma.service';\nimport { JwtPayload } from '../interfaces/jwt-payload.interface';\n\n@Injectable()\nexport class JwtRefreshStrategy extends PassportStrategy(Strategy, 'jwt-refresh') {\n  constructor(\n    private configService: ConfigService,\n    private prisma: PrismaService,\n  ) {\n    super({\n      jwtFromRequest: (request: Request) => {\n        return request?.cookies?.Refresh;\n      },\n      ignoreExpiration: false,\n      secretOrKey: configService.get<string>('jwt.refreshSecret'),\n    });\n  }\n\n  async validate(payload: JwtPayload): Promise<JwtPayload> {\n    const user = await this.prisma.user.findUnique({\n      where: { id: payload.userId },\n    });\n\n    if (!user || !user.is_active) {\n      throw new UnauthorizedException('User not found or inactive');\n    }\n\n    return payload;\n  }\n}\n","D:/CODING/WEB/learn-nest/src/modules/auth/core/strategies/jwt.strategy.ts":"import { Injectable, UnauthorizedException } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { PassportStrategy } from '@nestjs/passport';\nimport { ExtractJwt, Strategy } from 'passport-jwt';\nimport { Request } from 'express';\nimport { PrismaService } from '@common/prisma/prisma.service';\nimport { JwtPayload } from '../interfaces/jwt-payload.interface';\n\n@Injectable()\nexport class JwtStrategy extends PassportStrategy(Strategy) {\n  constructor(\n    private configService: ConfigService,\n    private prisma: PrismaService,\n  ) {\n    super({\n      jwtFromRequest: ExtractJwt.fromExtractors([\n        (request: Request) => {\n          return request?.cookies?.Authentication;\n        },\n      ]),\n      ignoreExpiration: false,\n      secretOrKey: configService.get<string>('jwt.secret'),\n    });\n  }\n\n  async validate(payload: JwtPayload): Promise<JwtPayload> {\n    const user = await this.prisma.user.findUnique({\n      where: { id: payload.userId },\n      include: {\n        position: {\n          include: {\n            position_permissions: {\n              include: {\n                permission: true,\n              },\n            },\n          },\n        },\n      },\n    });\n\n    if (!user || !user.is_active) {\n      throw new UnauthorizedException('User not found or inactive');\n    }\n\n    // Build permissions array from position\n    const permissions = user.position.position_permissions.map(\n      (pp) => pp.permission.name,\n    );\n\n    return {\n      userId: user.id,\n      email: user.email,\n      positionId: user.position.id,\n      positionName: user.position.name,\n      permissions,\n    };\n  }\n}\n","D:/CODING/WEB/learn-nest/src/modules/districts/controllers/v1/district.controller.ts":"import {\r\n  BadRequestException,\r\n  Body,\r\n  Controller,\r\n  Delete,\r\n  Get,\r\n  HttpCode,\r\n  HttpStatus,\r\n  Param,\r\n  ParseIntPipe,\r\n  Patch,\r\n  Post,\r\n  Query,\r\n  UploadedFile,\r\n  UseGuards,\r\n  UseInterceptors,\r\n} from '@nestjs/common';\r\n\r\nimport { ApiBody, ApiConsumes, ApiNoContentResponse, ApiOperation, ApiTags } from '@nestjs/swagger';\r\nimport { FileInterceptor } from '@nestjs/platform-express';\r\nimport { DistrictService } from '../../district.service';\r\nimport { PermissionsGuard } from '@common/guards/permissions.guard';\r\nimport { JwtAuthGuard } from '@common/guards/jwt-auth.guard';\r\nimport { Permissions } from '@common/decorators/permissions.decorator';\r\nimport { PERMISSIONS } from '@common/constants/permissions.constant';\r\nimport {\r\n  ApiSuccessResponse,\r\n  ApiSuccessArrayResponse,\r\n} from '@common/decorators/api-response.decorator';\r\nimport { DistrictEntity } from '@modules/districts/core/entities/district.entity';\r\nimport { CreateDistrictDto } from '@modules/districts/core/dto/create-district.dto';\r\nimport { UpdateDistrictDto } from '@modules/districts/core/dto/update-district.dto';\r\nimport { GeoJsonFilePipe } from '@common/pipes/geojson-file.pipe';\r\nimport { DistrictGeomTypePipe } from '@common/pipes/district-geomtype.pipe';\r\nimport { CacheInterceptor } from '@nestjs/cache-manager';\r\nimport { PaginatedResponseDto } from '@common/dto/pagination.dto';\r\nimport { DistrictQueryDto } from '@modules/districts/core/dto/district-query.dto';\r\n\r\n@ApiTags('District')\r\n@Controller({ path: 'district', version: '1' })\r\n@UseInterceptors(CacheInterceptor)\r\n@UseGuards(JwtAuthGuard, PermissionsGuard)\r\nexport class DistrictController {\r\n  constructor(private readonly districtService: DistrictService) {}\r\n\r\n  @Post()\r\n  @Permissions(PERMISSIONS.DISTRICT.ADD)\r\n  @UseInterceptors(FileInterceptor('file'))\r\n  @ApiConsumes('multipart/form-data')\r\n  @ApiBody({\r\n    schema: {\r\n      type: 'object',\r\n      required: ['name', 'file'],\r\n      properties: {\r\n        name: { type: 'string', example: 'District Name' },\r\n        description: { type: 'string', example: 'District description' },\r\n        layerId: { type: 'integer', example: 1, description: 'Available Layer ID' },\r\n        file: { type: 'string', format: 'binary', description: 'GeoJSON file (.geojson or .json)' },\r\n      },\r\n    },\r\n  })\r\n  @ApiOperation({ summary: 'Create a new district' })\r\n  @ApiSuccessResponse(DistrictEntity)\r\n  async create(\r\n    @Body() createDistrictDto: CreateDistrictDto,\r\n    @UploadedFile(new GeoJsonFilePipe(), new DistrictGeomTypePipe()) geoJsonFile?: string,\r\n  ): Promise<DistrictEntity> {\r\n    if (geoJsonFile) {\r\n      const result = await this.districtService.createFromGeoJson(\r\n        geoJsonFile,\r\n        createDistrictDto\r\n      );\r\n      return result as DistrictEntity;\r\n    } else {\r\n      throw new BadRequestException('GeoJSON file is required to create a district');\r\n    }\r\n  }\r\n\r\n  @Get()\r\n  @Permissions(PERMISSIONS.DISTRICT.VIEW)\r\n  @ApiOperation({ summary: 'Get all districts with pagination and filter' })\r\n  @ApiSuccessArrayResponse(DistrictEntity)\r\n  async findAll(@Query() query: DistrictQueryDto): Promise<PaginatedResponseDto<DistrictEntity>> {\r\n    return this.districtService.findAll(query);\r\n  }\r\n\r\n\r\n  @Get(':id')\r\n  @Permissions(PERMISSIONS.DISTRICT.VIEW)\r\n  @ApiOperation({ summary: 'Get district by ID' })\r\n  @ApiSuccessResponse(DistrictEntity)\r\n  async findOne(@Param('id', ParseIntPipe) id: number) {\r\n    return this.districtService.findOne(id);\r\n  }\r\n\r\n  @Patch(':id')\r\n  @Permissions(PERMISSIONS.DISTRICT.UPDATE)\r\n  @UseInterceptors(FileInterceptor('file'))\r\n  @ApiConsumes('multipart/form-data')\r\n  @ApiBody({\r\n    schema: {\r\n      type: 'object',\r\n      properties: {\r\n        name: { type: 'string', example: 'Updated District Name' },\r\n        description: { type: 'string', example: 'Updated district description' },\r\n        file: {\r\n          type: 'string',\r\n          format: 'binary',\r\n          description: 'Optional GeoJSON file (.geojson or .json)',\r\n        },\r\n      },\r\n    },\r\n  })\r\n  @ApiOperation({ summary: 'Update district' })\r\n  @ApiSuccessResponse(DistrictEntity)\r\n  async update(\r\n    @Param('id', ParseIntPipe) id: number,\r\n    @Body() updateDistrictDto: UpdateDistrictDto,\r\n    @UploadedFile(new GeoJsonFilePipe(), new DistrictGeomTypePipe()) geoJsonFile?: string,\r\n  ) {\r\n    return this.districtService.update(id, updateDistrictDto, geoJsonFile);\r\n  }\r\n  @Delete(':id')\r\n  @Permissions(PERMISSIONS.DISTRICT.DELETE)\r\n  @HttpCode(HttpStatus.NO_CONTENT)\r\n  @ApiOperation({ summary: 'Delete district' })\r\n  @ApiNoContentResponse({ description: 'District soft-deleted' })\r\n  async remove(@Param('id', ParseIntPipe) id: number): Promise<void> {\r\n    return this.districtService.remove(id);\r\n  }\r\n\r\n\r\n}\r\n","D:/CODING/WEB/learn-nest/src/modules/districts/core/dto/create-district.dto.ts":"import { ApiProperty } from '@nestjs/swagger';\nimport { IsInt, IsNotEmpty, IsOptional } from 'class-validator';\nimport { Type } from 'class-transformer';\n\nexport class CreateDistrictDto {\n  @ApiProperty({ example: 'District Name' })\n  @IsNotEmpty({ message: 'District name is required' })\n  name: string;\n\n  @ApiProperty({ example: 'District description', required: false })\n  @IsOptional()\n  description?: string;\n\n  @ApiProperty({ example: 'Available Layer ID' })\n  @IsNotEmpty({ message: 'Layer ID is required' })\n  @Type(() => Number)\n  @IsInt({ message: 'Layer ID must be an integer' })\n  layerId: number;\n}\n","D:/CODING/WEB/learn-nest/src/modules/districts/core/dto/district-query.dto.ts":"import { ApiPropertyOptional } from '@nestjs/swagger';\r\nimport { IsOptional, IsString} from 'class-validator';\r\nimport { PaginationDto } from '@common/dto/pagination.dto';\r\n\r\nexport class DistrictQueryDto extends PaginationDto {\r\n  @ApiPropertyOptional({ example: 'District' })\r\n  @IsOptional()\r\n  @IsString()\r\n  search?: string;\r\n}\r\n","D:/CODING/WEB/learn-nest/src/modules/districts/core/dto/update-district.dto.ts":"import { ApiProperty, ApiPropertyOptional } from '@nestjs/swagger';\nimport { IsOptional } from 'class-validator';\n\nexport class UpdateDistrictDto {\n  @ApiPropertyOptional({ example: 'District Name' })\n  @IsOptional()\n  name?: string;\n\n  @ApiPropertyOptional({ example: 'District description', required: false })\n  @IsOptional()\n  description?: string;\n}\n","D:/CODING/WEB/learn-nest/src/modules/districts/core/entities/district.entity.ts":"import { ApiProperty, ApiPropertyOptional } from '@nestjs/swagger';\r\nimport {District as PrismaDistrict, Feature} from '@prisma/client';\r\n\r\n\r\n\r\nexport class DistrictEntity implements Partial<PrismaDistrict> {\r\n    @ApiProperty()\r\n    id: number;\r\n\r\n    @ApiProperty()\r\n    name: string;\r\n\r\n    @ApiPropertyOptional()\r\n    description: string;\r\n\r\n    @ApiProperty()\r\n    feature_id: number;\r\n\r\n    @ApiPr xception('Layer not found');\r\n  }\r\n\r\n  const district = await this.prisma.$transaction(async (tx) => {\r\n    // 1. Create feature\r\n    const feature = await tx.$queryRaw<{ id: number }[]>(\r\n      Prisma.sql`\r\n        INSERT INTO \"features\" (\r\n          \"layer_id\",\r\n          \"geom\",\r\n          \"name\",\r\n          \"updated_at\"\r\n        )\r\n        VALUES (\r\n          ${layerId},\r\n          ST_SetSRID(\r\n            ST_GeomFromGeoJSON(${geoJsonValue}),\r\n            4326\r\n          ),\r\n          ${name},\r\n          NOW()\r\n        )\r\n        RETURNING \"id\"\r\n      `,\r\n    );\r\n\r\n    const featureId = feature[0]?.id;\r\n\r\n    if (!featureId) {\r\n      throw new Error('Failed to create feature');\r\n    }\r\n\r\n    // 2. Create district\r\n    const district = await tx.district.create({\r\n      data: {\r\n        name,\r\n        description,\r\n        feature_id: featureId,\r\n      }\r\n    });\r\n\r\n    return district;\r\n  });\r\n\r\n  await this.cacheManager.clear()\r\n  return district as DistrictEntity;\r\n}\r\n\r\n  async findAll(query: DistrictQueryDto): Promise<PaginatedResponseDto<DistrictEntity>> {\r\n    const { page = 1, limit = 10, search } = query;\r\n    const skip = (page - 1) * limit;\r\n    const searchTerm = search?.trim();\r\n\r\n    const whereClause = searchTerm\r\n      ? Prisma.sql`WHERE d.\"deleted_at\" IS NULL AND d.\"name\" ILIKE ${`%${searchTerm}%`}`\r\n      : Prisma.sql`WHERE d.\"deleted_at\" IS NULL`;\r\n\r\n    const [districts, countResult] = await Promise.all([\r\n      this.prisma.$queryRaw<any[]>(Prisma.sql`\r\n        SELECT\r\n          d.\"id\",\r\n          d.\"name\",\r\n          d.\"description\",\r\n          d.\"feature_id\",\r\n          d.\"created_at\",\r\n          d.\"updated_at\",\r\n          d.\"deleted_at\",\r\n          COALESCE(\r\n            json_agg(\r\n              json_build_object(\r\n                'id', f.\"id\",\r\n                'geom', ST_AsGeoJSON(f.\"geom\")::json,\r\n                'name', f.\"name\",\r\n                'properties', f.\"properties\",\r\n                'layer_id', f.\"layer_id\"\r\n              )\r\n            ) FILTER (WHERE f.\"id\" IS NOT NULL),\r\n            '[]'::json\r\n          ) AS \"features\"\r\n        FROM \"districts\" d\r\n        LEFT JOIN \"features\" f ON d.\"feature_id\" = f.\"id\"\r\n        ${whereClause}\r\n        GROUP BY\r\n          d.\"id\",\r\n          d.\"name\",\r\n          d.\"description\",\r\n          d.\"feature_id\",\r\n          d.\"created_at\",\r\n          d.\"updated_at\",\r\n          d.\"deleted_at\"\r\n        ORDER BY d.\"created_at\" DESC, d.\"id\" DESC\r\n        LIMIT ${limit}\r\n        OFFSET ${skip}\r\n      `),\r\n      this.prisma.$queryRaw<{ total: number }[]>(Prisma.sql`\r\n        SELECT COUNT(*)::int AS \"total\"\r\n        FROM \"districts\" d\r\n        ${whereClause}\r\n      `),\r\n    ]);\r\n\r\n    const total = countResult[0]?.total ?? 0;\r\n\r\n    return {\r\n      data: DistrictTransformHelper.toEntities(districts),\r\n      meta: {\r\n        total,\r\n        page,\r\n        limit,\r\n        totalPages: Math.ceil(total / limit),\r\n      },\r\n    };\r\n  }\r\n\r\n  async findOne(id: number): Promise<DistrictEntity> {\r\n    const [district] = await this.prisma.$queryRaw<any[]>(Prisma.sql`\r\n      SELECT\r\n        d.\"id\",\r\n        d.\"name\",\r\n        d.\"description\",\r\n        d.\"feature_id\",\r\n        d.\"created_at\",\r\n        d.\"updated_at\",\r\n        d.\"deleted_at\",\r\n        COALESCE(\r\n          json_agg(\r\n            json_build_object(\r\n              'id', f.\"id\",\r\n              'geom', ST_AsGeoJSON(f.\"geom\")::json,\r\n              'name', f.\"name\",\r\n              'properties', f.\"properties\",\r\n              'layer_id', f.\"layer_id\"\r\n            )\r\n          ) FILTER (WHERE f.\"id\" IS NOT NULL),\r\n          '[]'::json\r\n        ) AS \"features\"\r\n      FROM \"districts\" d\r\n      LEFT JOIN \"features\" f ON d.\"feature_id\" = f.\"id\"\r\n      WHERE d.\"id\" = ${id} AND d.\"deleted_at\" IS NULL\r\n      GROUP BY\r\n        d.\"id\",\r\n        d.\"name\",\r\n        d.\"description\",\r\n        d.\"feature_id\",\r\n        d.\"created_at\",\r\n        d.\"updated_at\",\r\n        d.\"deleted_at\"\r\n    `);\r\n\r\n    if (!district) {\r\n      throw new NotFoundException('District not found');\r\n    }\r\n\r\n    return DistrictTransformHelper.toEntity(district);\r\n  }\r\n\r\n  async update(\r\n    id: number,\r\n    updateDistrictDto: UpdateDistrictDto,\r\n    geoJsonValue?: string,\r\n  ): Promise<DistrictEntity> {\r\n    const { name, description } = updateDistrictDto;\r\n\r\n    const district = await this.prisma.district.findUnique({\r\n      where: { id },\r\n      include: { feature: true },\r\n    });\r\n\r\n    if (!district || district.deleted_at) {\r\n      throw new NotFoundException('District not found');\r\n    }\r\n\r\n    if (name !== undefined && name !== district.name) {\r\n      const nameTaken = await this.prisma.district.findFirst({\r\n        where: {\r\n          name,\r\n          deleted_at: null,\r\n          id: { not: id },\r\n        },\r\n      });\r\n\r\n      if (nameTaken) {\r\n        throw new ConflictException('District with the same name already exists');\r\n      }\r\n    }\r\n\r\n    const districtData: Prisma.DistrictUpdateInput = {};\r\n\r\n    if (name !== undefined) {\r\n      districtData.name = name;\r\n    }\r\n\r\n    if (description !== undefined) {\r\n      districtData.description = description;\r\n    }\r\n    if (Object.keys(districtData).length > 0) {\n      await this.prisma.district.update({\r\n        where: { id },\r\n        data: districtData,\r\n      });\r\n    }\r\n\r\n    if (geoJsonValue) {\r\n      await this.prisma.$queryRaw<any[]>(Prisma.sql`\r\n        UPDATE \"features\"\r\n        SET\r\n          \"geom\" = ST_SetSRID(ST_GeomFromGeoJSON(${geoJsonValue}), 4326),\r\n          \"updated_at\" = NOW()\r\n        WHERE \"id\" = ${district.feature_id}\r\n        RETURNING *\r\n      `);\r\n    }\r\n\r\n    const refreshedDistrict = await this.prisma.district.findUnique({\r\n      where: { id },\r\n      include: { feature: true },\r\n    });\r\n\r\n    await this.cacheManager.clear();\r\n\r\n    return DistrictTransformHelper.toEntity({\r\n      ...refreshedDistrict,\r\n      features: refreshedDistrict?.feature ? [refreshedDistrict.feature] : [],\r\n    });\r\n  }\r\n\r\n  async remove(id: number): Promise<void> {\r\n    const district = await this.prisma.district.findUnique({\r\n      where: { id },\r\n    });\r\n\r\n    if (!district || district.deleted_at) {\r\n      throw new NotFoundException('District not found');\r\n    }\r\n\r\n    await this.prisma.district.update({\r\n      where: { id },\r\n      data: { deleted_at: new Date() },\r\n    });\r\n\r\n    await this.prisma.$executeRaw(\r\n      Prisma.sql`\r\n        UPDATE \"features\"\r\n        SET \"deleted_at\" = NOW(), \"updated_at\" = NOW()\r\n        WHERE \"id\" = ${district.feature_id} AND \"deleted_at\" IS NULL\r\n      `,\r\n    );\r\n\r\n    await this.cacheManager.clear();\r\n  }\r\n}\r\n","D:/CODING/WEB/learn-nest/src/modules/health/health.controller.ts":"import { Controller, Get } from '@nestjs/common';\nimport { ApiTags, ApiOperation } from '@nestjs/swagger';\nimport { Public } from '@common/decorators/public.decorator';\n\n@ApiTags('Health')\n@Controller()\nexport class HealthController {\n  @Public()\n  @Get('health')\n  @ApiOperation({ summary: 'Health check endpoint' })\n  health() {\n    return {\n      status: 'ok',\n      timestamp: new Date().toISOString(),\n      uptime: process.uptime(),\n      environment: process.env.NODE_ENV,\n    };\n  }\n\n  @Public()\n  @Get('ping')\n  @ApiOperation({ summary: 'Ping endpoint' })\n  ping() {\n    return {\n      message: 'pong',\n      timestamp: new Date().toISOString(),\n
